name: penny
description: "Penny: a money buddy for Indian users."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.8
  fl_chart: ^1.3.0
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  google_sign_in: ^7.2.0
  clock: ^1.1.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-Baloo2.txt
    - assets/fonts/OFL-DMSans.txt

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

# The app icon and the launch screen, from images that
# tool/render_icons_test.dart draws with Penny's own painter. After changing
# them: dart run flutter_launcher_icons, then
# dart run flutter_native_splash:create.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FFD84D"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

flutter_native_splash:
  color: "#FFF8EC"
  image: assets/icon/splash.png
  android_12:
    color: "#FFF8EC"
    image: assets/icon/splash_android12.png
  web: false
